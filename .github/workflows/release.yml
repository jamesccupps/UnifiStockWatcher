# Push a tag vX.Y.Z (matching unifi_core.__version__) to test, build, sign, check and publish a
# release, in five jobs:
#
#   build         tests, and builds the program folder (PyInstaller) unsigned. PyInstaller and its
#                 dependencies run here, and no key or signing identity ever does.
#   authenticode  in the `release` environment: signs in to Azure with GitHub's OIDC token,
#                 code-signs the two exes as James Cupps (Azure Artifact Signing), then makes the
#                 zip and the installer around them with the pinned Inno Setup, which signs the
#                 uninstaller and Setup.exe. Nothing from PyPI runs here, and the program never runs.
#   verify        the portable, installer and update tests on those exact files, every exe's
#                 signature checked (the installed uninstaller's too).
#   sign          on a fresh runner, in the `release` environment (the only place the
#                 UPDATE_SIGNING_KEY secret is given out): installs only requirements-sign.txt
#                 (hash-pinned cryptography), writes latest.json for the signed files, and checks
#                 it against the public key built into the app, so a wrong secret stops the
#                 release here, not in users' updaters. The key goes from the secret to the
#                 signing script through the environment and is never written to disk.
#   publish       the only job that can write to the repository: checks the files against
#                 SHA256SUMS.txt and publishes them.
#
# A tag vX.Y.Z-signtest.N (X.Y.Z = unifi_core.__version__) runs build, authenticode and verify
# and publishes nothing: for trying a change to code signing without a release. Delete the tag
# afterwards.
#
# What installed copies read from a release can never change: the tag vX.Y.Z, and the assets
# UnifiStockWatcher-Setup.exe, UnifiStockWatcher-win64.zip and latest.json (updater.py).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      signtest: ${{ steps.tag.outputs.signtest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Tag must match the version
        id: tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The updater compares this tag with the version built into the app: if they differed,
          # every copy would download this release again every day. (The tag comes through the
          # environment, never pasted into the script.) vX.Y.Z-signtest.N is a code-signing test.
          $v = python -c "import unifi_core; print(unifi_core.__version__)"
          if ($env:TAG -ceq "v$v") { $signtest = 'false' }
          elseif ($env:TAG.StartsWith("v$v-signtest", [StringComparison]::Ordinal)) {
            $signtest = 'true'
            "::notice::$env:TAG is a code-signing test of ${v}: built, signed and tested, never published"
          }
          else { throw "tag $env:TAG, but unifi_core.__version__ is $v" }
          "signtest=$signtest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint and test
        run: |
          python -m pyflakes unifi_core.py unifi_watcher.py unifi_watcher_gui.py updater.py ed25519.py gfx.py theme.py tray.py winplatform.py webhooks.py
          python -m pytest tests --tb=short

      - name: Build the program folder (unsigned)
        run: python scripts/build_windows.py --program

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-build
          path: dist/UnifiStockWatcher
          if-no-files-found: error
          retention-days: 7

  authenticode:
    # Azure accepts GitHub's OIDC token for the signing account (SlateAccount, profile Slate:
    # the certificate Slate, NoteForge and PingerPlot sign with) only from this repository's
    # `release` environment (subject repo:jamesccupps/UnifiStockWatcher:environment:release),
    # which admits tags v*.*.* only, so no password or key is stored for it; the AZURE_* secrets
    # just say which app registration ("Slate signing"). This job gets the program folder the
    # build job froze and never runs it: what runs here is GitHub's and Microsoft's actions
    # (pinned), Microsoft's ArtifactSigning module (pinned version), Inno Setup (pinned by
    # SHA-256) and this tag's packaging code, which is standard library.
    name: Code-sign and make the downloads
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write          # the OIDC token Azure signs in with
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: program-build
          path: dist/UnifiStockWatcher

      - name: Install Inno Setup (pinned)
        shell: pwsh
        run: ./scripts/install_inno.ps1

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The version scripts/authenticode.ps1 imports
      - name: Install the ArtifactSigning module
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Repository PSGallery -Scope CurrentUser -Force

      # The exes are signed first, so the zip and Setup.exe carry signed copies; Inno Setup signs
      # the uninstaller and Setup.exe as it makes them. latest.json and SHA256SUMS.txt come later,
      # from the sign job, so they are of the signed files.
      - name: Sign the exes, then make the zip and the installer around them
        run: python -I scripts/build_windows.py --package --authenticode --no-sign

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: |
            dist/UnifiStockWatcher-Setup.exe
            dist/UnifiStockWatcher-win64.zip
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Test the signed files
    needs: [build, authenticode]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PUBLISHER: "CN=James Cupps, O=James Cupps"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: dist

      - name: Self-test the portable build
        shell: pwsh
        run: ./scripts/test_portable.ps1 -Publisher $env:PUBLISHER

      - name: Install, self-test and uninstall this installer
        shell: pwsh
        run: |
          $v = python -c "import unifi_core; print(unifi_core.__version__)"
          ./scripts/test_installer.ps1 -Setup dist\UnifiStockWatcher-Setup.exe -Version $v -Publisher $env:PUBLISHER

      # These exact files, signed for the test with a throwaway key: a release that the previous
      # one can't update to is never published.
      - name: Update the previous release to these files
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/test_update.ps1

  sign:
    name: Sign latest.json
    needs: [build, authenticode, verify]
    if: needs.build.outputs.signtest != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the signing packages (hash-pinned, wheels only)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r requirements-sign.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: dist

      - name: Write latest.json for these files
        env:
          USW_SIGNING_KEY_PEM: ${{ secrets.UPDATE_SIGNING_KEY }}
          USW_DATA_DIR: ${{ runner.temp }}/usw-data
        run: |
          if [ -z "$USW_SIGNING_KEY_PEM" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret isn't set; an unsigned release would never reach installed copies."
            exit 1
          fi
          python scripts/sign_release.py dist "$GITHUB_REF_NAME"

      - name: Verify latest.json against the key built into the app
        env:
          USW_DATA_DIR: ${{ runner.temp }}/usw-data
        run: python scripts/verify_release.py dist "$GITHUB_REF_NAME"

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum UnifiStockWatcher-Setup.exe UnifiStockWatcher-win64.zip latest.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: |
            dist/latest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the GitHub release
    needs: [build, authenticode, verify, sign]
    if: needs.build.outputs.signtest != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # the release itself, and only here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Check the files against SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum --check --strict SHA256SUMS.txt
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="release-notes/$tag.md"
          opts=(--repo "$GITHUB_REPOSITORY" --title "UniFi Stock Watcher ${tag#v}" --verify-tag)
          if [ -f "$notes" ]; then opts+=(--notes-file "$notes"); else opts+=(--generate-notes); fi
          gh release create "$tag" dist/UnifiStockWatcher-Setup.exe dist/UnifiStockWatcher-win64.zip \
            dist/latest.json dist/SHA256SUMS.txt "${opts[@]}"
