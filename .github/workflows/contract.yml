name: Store contract

# The mocked suite cannot notice the store changing shape, and that is how
# this app breaks: a response change leaves every test green while the
# watcher quietly reports the wrong thing. This job talks to the real store
# so a change is visible the day it ships, not the day a restock is missed.
#
# It found a live one on its first run: two categories had been renamed and
# 66 products, including every camera, had silently stopped being watched.

on:
  schedule:
    - cron: "17 6 * * *"        # daily, off the hour to avoid the stampede
  workflow_dispatch:

permissions:
  contents: read
  issues: write            # the failure path opens/updates a tracking issue

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check the store contract
        run: |
          set +e
          python -m pytest tests_live -p no:cacheprovider --tb=short > contract.log 2>&1
          code=$?
          cat contract.log
          if [ $code -ne 0 ]; then
            summary=$(grep -E '^(FAILED|ERROR)' contract.log | head -30)
            if [ -z "$summary" ]; then summary=$(tail -40 contract.log); fi
            encoded=$(printf '%s\n' "$summary" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Ubiquiti store contract changed::${encoded}"
          fi
          exit $code

      - name: Upload contract log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-log
          path: contract.log

      - name: Open an issue when the contract breaks
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Store contract check failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'store-contract',
            });
            const body = [
              'The nightly contract check against store.ui.com failed.',
              '',
              'That usually means Ubiquiti changed a response shape, renamed a',
              'category, or altered how stock is reported - the mocked suite',
              'cannot see any of those.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId}`,
            ].join('\n');
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['store-contract'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            }
