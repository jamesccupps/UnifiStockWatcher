name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyflakes

      - name: Lint
        run: python -m pyflakes *.py tests/*.py

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests -q

      # Tk needs a display; the GUI tests skip themselves if it is missing,
      # but xvfb lets them actually run on Linux too.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests -q
