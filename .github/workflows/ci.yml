name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    # Windows runners default to PowerShell, which does not expand globs for
    # native commands - `python -m pyflakes *.py` reaches pyflakes as the
    # literal string and exits 1. Pin bash so every step behaves identically
    # across the matrix.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyflakes

      - name: Report environment
        run: |
          python -VV
          python -c "import tkinter; print('tkinter Tk', tkinter.TkVersion)" || echo "tkinter unavailable"
          pip list

      - name: Lint
        run: python -m pyflakes *.py tests/*.py

      # Tk needs a display; the GUI tests skip themselves if it is missing,
      # but xvfb lets them actually run on Linux too.
      - name: Test
        run: |
          set +e
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest tests --tb=short > pytest.log 2>&1
          else
            python -m pytest tests --tb=short > pytest.log 2>&1
          fi
          code=$?
          cat pytest.log
          if [ $code -ne 0 ]; then
            # Job logs need a signed-in session; annotations do not. Surface the
            # failure summary as one so it is readable from the run page and via
            # the public checks API.
            summary=$(grep -E '^(FAILED|ERROR)' pytest.log | head -30)
            if [ -z "$summary" ]; then summary=$(tail -40 pytest.log); fi
            encoded=$(printf '%s\n' "$summary" | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest failed on ${RUNNER_OS} py${{ matrix.python-version }}::${encoded}"
          fi
          exit $code

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest.log
